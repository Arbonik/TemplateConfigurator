message TerrainConfig {
  TemplateGenerationEnums.TerrainType TerrainType = 1; // айди террейна, по аналогии с террейном в зонах
  TemplateGenerationEnums.TerrainType MirrorTerrainType = 2;  // отзеркалить настройки какого то террейна, если указано то другие настройки игнорируются
  repeated string BuildingsToDelete = 3; // строковые названия объектов для удаления из всех секций перечисленных ниже
  repeated int32 BuildingsToAdd = 4; // ID из ShopBuildingConfigs для добавления во все секции перечисленные ниже
  TerrainBuildingsConfig NewLuckMoraleBuildings = 5; // Повышалки удачи, морали и мувов, не охраняются
  TerrainBuildingsConfig NewShopBuildings = 6; // Элемник,мастерская, библа и т.д. Эти строения охраняются.
  TerrainBuildingsConfig NewResourceGivers = 7; // Мельница, сокровищница, леприкон. Не охраняются.
  TerrainBuildingsConfig NewUpgradeBuildings = 8; // Повышалки статов. Здания охраняются
  TerrainBuildingsConfig NewShrines = 9; // Шрайны на экспу. Не охраняются
  TerrainBuildingsConfig NewTreasuryBuildings = 10; //  Банки стартовой зоны. Не охраняются.
  TerrainBuildingsConfig NewBuffBuildings = 11; // Банки сегмент +. Не охраняются
}

message FactionTerrainConfig {
  TerrainBuildingsConfig NewLuckMoraleBuildings = 1; // Повышалки удачи, морали и мувов, не охраняются
  TerrainBuildingsConfig NewShopBuildings = 2; // Элемник,мастерская, библа и т.д. Эти строения охраняются.
  TerrainBuildingsConfig NewResourceGivers = 3; // Мельница, сокровищница, леприкон. Не охраняются.
  TerrainBuildingsConfig NewUpgradeBuildings = 4; // Повышалки статов. Здания охраняются
  TerrainBuildingsConfig NewShrines = 5; // Шрайны на экспу. Не охраняются
  TerrainBuildingsConfig NewTreasuryBuildings = 6; //  Банки стартовой зоны. Не охраняются.
  TerrainBuildingsConfig NewBuffBuildings = 7; // Банки сегмент +. Не охраняются
}

