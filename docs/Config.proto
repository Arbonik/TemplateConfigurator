syntax = "proto3";
import "google/protobuf/wrappers.proto";
import "HeroTypeEnum.proto";
import "SpellTypeEnum.proto";
import "ArtifactTypeEnum.proto";
import "MapObjectEnum.proto";
import "Common.proto";
import "Enums.proto";
import "TemplateGeneration/Enums.proto";
package TemplateGenerationConfigs;
option optimize_for = SPEED;

// Это входная точка генерации, эта модель будет рутовая в json документе
message TemplateGenerationConfig {
  string TemplateName = 1; // название шаблона который будет заменяться
  repeated ZoneGenerationConfig Zones = 2; // настройка зон, не заполненные параметры будут использованы из оригинального XDB
  repeated ConnectionModel Connections = 3; // настройки ГО шаблона,  не заполненные параметры будут использованы из оригинального XDB
  repeated TerrainConfig TerrainConfig = 4; // управлениями объектов в шоп поинтсах под конкретные террейны
  map<string, FactionTerrainConfig> FactionTerrainConfigs = 5; //  объектов в шоп поинтсах для конкретной фракции (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  repeated StartBuildingConfig StartBuildingConfigs = 6; // общие настройки стартовых зданий в городах
  repeated SpecificCastleBuildingConfig SpecificCastlesStartBuildings = 7; // настройки стартовых зданий в конкретных городах
  GeneralData GeneralData = 8; // общие настройки: иконки, плотность боёв и т.д.

  google.protobuf.DoubleValue BaseArmyMultiplier = 9; // общий множитель стартовой армии, 1 по умолчанию
  map<string, double> ArmyMultipliers = 10; //  настройка множителей для конкретной фракции (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )

  ScriptFeaturesConfig ScriptFeaturesConfig = 11; // настройки скриптовых фич
  EntitiesBanModel EntitiesBanConfig = 12; // настройки банов на шаблоне
  StartSpellsConfig StartSpellsConfig = 13; // найстройки стартовых заклинаний

  repeated CustomBuildingConfig CustomBuildingConfigs = 14; // Создание кастомных зданий которые можно использовать в других секциях конфигов
  ZoneRandomizationConfig ZoneRandomizationConfig = 15; // настройки рандомизации координат в шаблоне
}

message EntitiesBanModel {
  repeated HeroTypeEnum.HeroType BannedHeroes = 1; // забаненные герои
  repeated SpellTypeEnum.SpellType BannedSpells = 2; // забаненные заклинания
  repeated ArtifactTypeEnum.ArtifactType BannedArtifacts = 3; // забаненные артефакты
  BasesBanModel BannedBases = 4; // забаненные базовые скиллы
  google.protobuf.BoolValue BanMaradeur = 5; // забанить мародерство?
}

message GeneralData {
  google.protobuf.Int32Value Mine1LevelGuardLevel = 1; // охрана древесины и рудника
  google.protobuf.Int32Value Mine2LevelGuardLevel = 2; // охрана шахт редких ресурсов
  google.protobuf.Int32Value MineGoldGuardLevel = 3; // охрана голд шахт
}

message IntValueConfig {
  google.protobuf.Int32Value MinValue = 1; // минимальное значение параметра
  google.protobuf.Int32Value MaxValue = 2; // максимальное значение параметра
}

message CreaturesConfiguration {
  IntValueConfig ReplacementsCount = 1; // количество тиров, которые будут заменены
  google.protobuf.BoolValue TerrainFaction = 2; // добавлять ли юнитов текущего террейна
  google.protobuf.BoolValue NonPlayersFactions = 3; // включать ли фракции, не выданные игрокам
  bool PlayerFactions = 4; // добавлять ли фракции игроков
  TemplateGenerationEnums.PlayerType PlayerType = 5; // фракции каких игроков нужно добавить
  google.protobuf.BoolValue NoGrades = 6; // включать ли негрейды
  google.protobuf.BoolValue Grades = 7; // включать ли грейды
  google.protobuf.BoolValue Neutrals = 8; // включать ли нейтралов
  google.protobuf.DoubleValue BaseCostMultiplier = 9; // множитель стоимости в золоте
  google.protobuf.DoubleValue BaseResourcesMultiplier = 10; // множитель стоимости в ресурсах
  google.protobuf.DoubleValue BaseGrowMultiplier = 11; // множитель прироста
  repeated CreatureModifier CreatureModifiers = 12; // модификаторы юнитов по тирам
  repeated CreatureTierReplacement CreatureTierReplacements = 13; // конкретные юниты на замену в тирах, при заполнении секции в эти тиры будут рандомиться только юниты по указанным айди
  google.protobuf.BoolValue NonUniqueReplacements = 14; // могут ли заменённые юниты повторяться в других локациях
}

message CreatureModifier {
  int32 Tier = 1; // тир существа
  google.protobuf.DoubleValue CostMultiplier = 2; // множитель стоимости в золоте
  google.protobuf.DoubleValue ResourcesMultiplier = 3; // множитель стоимости в ресурсах
  google.protobuf.DoubleValue GrowMultiplier = 4; // множитель прироста
}

