// Начиная с поля CreatureBuilding допустима только одна вариация настройки т.е. нукжно заполнять только один из полей. По умолчанию считается первое если заполнить несколько
message CustomBuildingConfig {
  int32 Id = 1; // уникальный ID здания
  google.protobuf.Int64Value Value = 2; // велью здания
  google.protobuf.Int64Value GuardStrenght = 3; // размер охраны
  TemplateGenerationEnums.BuildingTextureConfig BuildingTexture = 4; // какая текстура будет использоваться для здания если применимо
  TemplateGenerationEnums.RoadType RoadType = 5; // какая дорога должна вести к объекту
  oneof BuildingType {
    CreatureBuildingConfig CreatureBuilding = 6; // банк существ
    google.protobuf.StringValue XdbRef = 7; // ссылка на объект в игре, должна использоваться достоверная href из файлов игры
    PandoraBoxConfig PandoraBox = 8; // коробка
    ResourceBuildingConfig ResourceGiver = 9; // здание для выдачи ресурсов
    ScriptBuildingConfig ScriptBuilding = 10; // одно из кастомных зданий без дополнительных настроек
    MageEyeConfig MageEye = 11; // здание для открытия тумана войны по заданным координатам
    RunicChestConfig RunicChest = 12;  // объект с выдачей рун герою
    ArtifactXdb ArtifactXdb = 13; // объект в виде артефакта 
    MapObjectXdb MapObjectXdb = 14; // один из дефолтных объектов

    DefaultBuildingConfig DefaultBuilding = 99;  // вариант объекта по умолчанию без кастомизации (текстура тоже будет взята из дефолтного объекта)
  }
  TemplateGenerationEnums.BuildingInteractionMessage InteractionMessageType = 15; // тип сообщения, которое вызывается при взаимодействии с этим объектом (на данный момент поддерживается только для CreatureBuilding IsDwelling = false) 
  LocalizedCustomTextsModel CustomTexts = 16; // кастомные описания для объекта
}

