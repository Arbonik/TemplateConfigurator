message CreatureTierReplacement {
  int32 Tier = 1; // тир, в котором будет произведеназамена
  repeated string CreatureIds = 2; // айди юнитов на замену
}

// Начиная с поля RandomDwellingConfig допустима только одна вариация настройки т.е. нукжно заполнять только один из полей. По умолчанию считается первое если заполнить несколько
message DwellingGenerationConfig {
  TemplateGenerationEnums.BuildingTextureConfig BuildingTexture = 1; // текстура двелов
  CreaturesConfiguration CreaturesConfiguration = 2; // настройки замены юнитов в двелах в рамках террейна.
  oneof GenerationType{
      RandomDwellingConfig RandomDwellingConfig = 3; // вариант рандомной генерации двелов
      StaticDwellingConfigs StaticDwellingConfigs = 4; // статичные наборы двеллингов
      DwellingByPointsConfig DwellingByPointsConfig = 5; // генерация двелинга по очкам
      DependantDwellingConfig DependantDwellingConfig = 6; // вариант генерации тиров на основе другой локации.
  }
}

message RandomDwellingConfig {
  int32 MinCount = 1; // минимальное количество двелов
  int32 MaxCount = 2; // максимальное количество двелов
  google.protobuf.Int64Value MinTiersCount = 3; // минимальное количество тиров существ в двелинга, по умолчанию 7
  google.protobuf.Int64Value MaxTiersCount = 4; // максимальное количество тиров существ в двелинга, по умолчанию 7
  google.protobuf.BoolValue UniformDistribution = 5; // равномерное распределение по тирам, т.е. если 14 двелов и 7 тиров их сдаст гарантированно T1x2;T2x2;T3x2;T4x2;T5x2;T6x2;T7x2
  repeated int64 AllowedTiers = 6; // массив разрешённых тиров для генерации, по умолчанию будут все тиры 1-7
  google.protobuf.Int64Value MinCountPerTier = 7; // настройка минимального количества двелов для тира
  google.protobuf.Int64Value MaxCountPerTier = 8; // настройка максимального количества двелов для тира
}

message StaticDwellingConfigs {
  repeated DwellingValue DwellingValue = 1; // набор статических вариаций двелов т1-т7, будет выбрана случайная
}

message DwellingByPointsConfig {
  int64 PointsCount = 1; // количество поинтов для распределения двелов
  map<string, int64> PointsCountByFaction = 3; // количество поинтов по фракциям (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  DwellingValue DwellingPoints = 4; // выставление велью поинтов конкретным тирам
  map<string, DwellingValue> DwellingPointsByFaction = 5; // выставление велью поинтов конкретным тирам по фракциям (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  google.protobuf.Int64Value MinTiersCount = 6; // минимальное количество тиров существ в двелинга
  google.protobuf.Int64Value MaxTiersCount = 7; // максимальное количество тиров существ в двелинга
  repeated int64 AllowedTiers = 8; // массив разрешённых тиров для генерации, по умолчанию будут все тиры 1-7
  DwellingValue MinCountPerTier = 9; // настройка минимального количества двелов для конкретного тира
  map<string, DwellingValue> MinCountPerTierByFaction = 10; // настройка минимального количества двелов для конкретного тира по фракциям (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  DwellingValue MaxCountPerTier = 11; // настройка максимального количества двелов для конкретного тира
  map<string, DwellingValue> MaxCountPerTierByFaction = 12; // настройка максимального количества двелов для конкретного тира по фракциям (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
}

message DependantDwellingConfig {
  int64 ZoneId = 1; // зона от которой зависят настройки двелингов
  int32 MinCount = 2; // минимальное количество двелов
  int32 MaxCount = 3; // максимальное количество двелов
  google.protobuf.Int64Value MinTiersCount = 4; // минимальное количество тиров существ в двелинга
  google.protobuf.Int64Value MaxTiersCount = 5; // максимальное количество тиров существ в двелинга
  google.protobuf.BoolValue UniformDistribution = 6; // равномерное распределение по тирам, т.е. если 14 двелов и 7 тиров их сдаст гарантированно T1x2;T2x2;T3x2;T4x2;T5x2;T6x2;T7x2
  google.protobuf.Int64Value MinCountPerTier = 7; // настройка минимального количества двелов для конкретного тира
  google.protobuf.Int64Value MaxCountPerTier = 8; // настройка максимального количества двелов для тира
  bool IsCopyMode = 9; // false - будут взяты тиры которые не сгенерировались в другой локации, true - тиры будут скопированы из другой локации
}


message DwellingValue {
  google.protobuf.Int64Value T1 = 1;
  google.protobuf.Int64Value T2 = 2;
  google.protobuf.Int64Value T3 = 3;
  google.protobuf.Int64Value T4 = 4;
  google.protobuf.Int64Value T5 = 5;
  google.protobuf.Int64Value T6 = 6;
  google.protobuf.Int64Value T7 = 7;
}

message ResourcesConfig {
  IntValueConfig Wood = 1; // Количетсов дерева
  IntValueConfig Ore = 2; // Количество руды
  IntValueConfig Mercury = 3; // Количество ртути
  IntValueConfig Crystals = 4;  // Количество кристалов
  IntValueConfig Sulfur = 5;  // Количество серы
  IntValueConfig Gems = 6;  // Количество самоцветов
  IntValueConfig Gold = 7;  // Количество золота
}

message ZoneGenerationConfig {
  int32 ZoneId = 1; // индекс зоны из шаблона
  TemplateGenerationEnums.TerrainType TerrainType = 2; // тип террейна
  google.protobuf.Int32Value MirrorZoneId = 3; // Id зоны с которой нужно скопировать остальные результаты генерации. Если параметр указан все остальные настройки кроме TerrainType, ZoneId и координат локации/замка игнорируются. CreaturesConfiguration возьмётся зеркальное только если не указано в оригинальном конфиге.
  DwellingGenerationConfig DwellingGenerationConfig = 4; // конфигурация генерации двелов
  ResourcesConfig MineGenerationConfig = 5; // конфигурация шахт
  IntValueConfig AbandonedMines = 6; //  количество забррошенных шахт
  IntValueConfig UpgBuildingsDensity = 7; //  повышалки героев
  IntValueConfig TreasureDensity = 8;  // ресурсы на земле
  IntValueConfig TreasureChestDensity = 9; // сундуки  на земле
  IntValueConfig Prisons = 10; // количество тюрем
  IntValueConfig TownGuardStrenght = 11; // охрана города
  IntValueConfig ShopPoints = 12; // очки магазинов
  IntValueConfig ShrinePoints = 13; // очки храмов магии 
  IntValueConfig LuckMoralBuildingsDensity = 14; // бафы на морраль, мувы и т.д.
  IntValueConfig ResourceBuildingsDensity = 15; // плотность размещения строений ресурсов
  IntValueConfig TreasureBuildingPoints = 16; // очки сокровищниц
  IntValueConfig TreasureBlocksTotalValue = 17; //  велью локации
  IntValueConfig DenOfThieves = 18; //  0 = стартовые сокровищницы, 1 = не стартовые
  IntValueConfig RedwoodObservatoryDensity = 19; // параметр силы локации 0 - старт, 1 - сегмент и т.д.
  IntValueConfig Size = 20; // размер локации
  google.protobuf.BoolValue Town = 21; // будет ли размещён город в локации
  IntValueConfig ZoneStartPointX = 22; // стартовая координата x из которой генерируется локация
  IntValueConfig ZoneStartPointY = 23; // стартовая координата y из которой генерируется локация
  IntValueConfig MainTownStartPointX = 24; // координата x стартового замка
  IntValueConfig MainTownStartPointY = 25; // координата y стартового замка
  IntValueConfig MainTownRotationDirection = 26; // поворот замка, принимает значение 0, 1, 2, 3
  google.protobuf.BoolValue TreasureBlocksScalingFromTownDist = 27; // включён ли скейлинг распределения велью по удалению от замка
  IntValueConfig DistBetweenTreasureBlocks = 28; // расстояние между боевыми точками, определяет плотность пробивок
  IntValueConfig Taverns = 29; // количество таверн
  IntValueConfig TradingPosts = 30; // количество факторий
  IntValueConfig HillForts = 31; // количество фортов
  IntValueConfig SpellMentors = 32; // количество менторов
  IntValueConfig MagicWells = 33; // количество колодцев на ману
  IntValueConfig LearningStones = 34; // количество шрайнов на 1к экспы
  IntValueConfig EnlightenmentStones = 35; // количество  шрайнов на 5к экспы
  IntValueConfig WisdomStones = 36; // количество шрайнов на 10к экспы
  IntValueConfig RedwoodObservatories = 37; // количество обзорок
  IntValueConfig Wagons = 38; // количество тележек с ресами
  IntValueConfig Skeletons = 39; // количество могил с артом
  IntValueConfig TombOfTheWarriors = 40; // количество могил с артом
  AdditionalMapObjectConfig AdditionalMapObjectConfig = 41; // настройка дополнительных объектов, если не указаны то возьмутся из зеркальной зоны при наличии
  
  google.protobuf.BoolValue RemoveZone = 101; // нужно ли удалить эту зону, остальные параметры  игнорируются
}

message AdditionalMapObjectConfig {
  repeated AdditionalObjectModel StaticObjects = 1; // Статичные объекты для постановки
  map<string, AdditionalObjectModels> StaticObjectsByCastle = 2; // Статичные объекты для постановки для конкретных фракций (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  repeated AdditionalObjectByPointsModel ByPointModels = 3; // объекты которые расставляются по очкам
  repeated AdditionalObjectFewOfModel FewOfModels = 4; // расстановка рандомных объектов из заданных наборов
  repeated ArtifactsGenerationModel ArtifactsGenerationModels = 5; // генерация артов по их стоимости
  ResourcesGenerationModel ResourcesGenerationModel = 6; // генерация ресурсов
}

message AdditionalObjectModels {
  repeated AdditionalObjectModel Objects = 1; // перечисление объектов
}

message AdditionalObjectModel {
  int32 BuildingId = 1; // id объекта из секции custom buildings
  IntValueConfig Count = 2; // количество объектов для постановки
}

message AdditionalObjectByPointsModel {
  int64 PointsCount = 1; // количество поинтов
  map<string, int64> PointsCountByFaction = 2; // количество поинтов по фракциям (Humans, Inferno, Necropolis, Elves, Liga, Mages, Dwarfs, Horde )
  map<int32, int64> PointsByBuildingId = 3; // id объекта из секции custom buildings с стоимостью в виде поинтов
  google.protobuf.Int64Value MinBuildingsCount = 4; // минимальное количество каждого из объектов
  google.protobuf.Int64Value MaxBuildingsCount = 5; // максимальное количество каждого из объектов
}

message AdditionalObjectFewOfModel {
  repeated FewOfModel Models = 1; // набор объектов
  IntValueConfig Count = 2; // количество объектов которое нужно выбрать
}

message FewOfModel {
  repeated AdditionalObjectModel Objects = 1; // перечисление объектов
  IntValueConfig Count = 2; // количество объектов которое нужно выбрать
}

message ArtifactsGenerationModel {
  repeated ArtifactTypeEnum.ArtifactType AllowedArtifacts = 1; // допустимые артефакты (по умолчанию доступны все)
  google.protobuf.Int64Value MinValue = 2; // минимальное велью артов ( > )
  google.protobuf.Int64Value MaxValue = 3; // максимальное велью артов ( <= )
  int64 TotalValue = 4; // общее велью артефактов в локации
  google.protobuf.Int64Value AllowedDuplicatesCount = 5; // допустимое количество дубликатов, по-умолчанию 0
  google.protobuf.DoubleValue GuardsMultiplier = 6; // множитель охраны артефактов 
}

message ResourcesGenerationModel {
  IntValueConfig Wood = 1; // Кучки дерева
  IntValueConfig Ore = 2; // Кучки руды
  google.protobuf.DoubleValue BaseResourcesGuardsMultiplier = 3; // множитель охраны дерева/руды
  IntValueConfig Mercury = 4; // Кучка ртути
  IntValueConfig Gems = 5; // Кучка самоцеветов
  IntValueConfig Crystal = 6; // Кучка кристалов
  IntValueConfig Sulfur = 7; // Кучка серы
  google.protobuf.DoubleValue RareResourcesGuardsMultiplier = 8; // множитель охраны редких ресурсов
  IntValueConfig Chest = 9; // Сундуки
  google.protobuf.DoubleValue ChestGuardsMultiplier = 10; // множитель охраны сндуков
  IntValueConfig Gold = 11; // Кучки золота
  google.protobuf.DoubleValue GoldGuardsMultiplier = 12; // множитель охраны золота
  IntValueConfig Campfire = 13; // Костры
  google.protobuf.DoubleValue CampfireGuardsMultiplier = 14; // множитель охраны костров
}

//SourceZoneIndex-DestZoneIndex-IsMain - эти три поля являются ключём для поиска. Если го по таком ключу будет найденно то следующие параметры будут просто обновлены, если нет - будет добавлено новое го в шаблон.
message ConnectionModel {
  int32 SourceZoneIndex = 1; // id зоны источника
  int32 DestZoneIndex = 2; // id зоны назначения
  bool IsMain = 3; // основное ГО или альтернативное

  google.protobuf.BoolValue RemoveConnection = 4; // нужно ли удалить это го, последующие параметры игнорируются

  google.protobuf.BoolValue TwoWay = 5;
  google.protobuf.Int32Value GuardStrenght = 6; // размер охраны ГО
  google.protobuf.BoolValue Guarded = 7; // наличие охраны на ГО
  google.protobuf.BoolValue Wide = 8;
  google.protobuf.BoolValue StaticPos = 9; // генерить ГО по указанным статисческим координатам true - по координатам false - случайно
  google.protobuf.Int32Value StartPointX = 10; // координата X для генерации ГО (если StaticPos = true)
  google.protobuf.Int32Value StartPointY = 11; // координата Y для генерации ГО (если StaticPos = true)
  google.protobuf.Int32Value MinRadiusToSearch = 12; // минимальный радиус поиска пересечений (если StaticPos = true)
  google.protobuf.Int32Value MaxRadiusToSearch = 13; // максимальный радиус поиска пересечений (если StaticPos = true)
  google.protobuf.Int32Value MinRadiusToMain = 14; // минимальный радиус для поиска основного ГО (если IsMain = false)
  google.protobuf.Int32Value MaxRadiusToMain = 15; // максимальный радиус для поиска основного ГО (если IsMain = false)
  google.protobuf.Int32Value RoadType = 16; // тип дороги: 0 – без дороги, 1 – земляная, 2 – каменная
}

